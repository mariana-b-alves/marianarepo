<!doctype html>
<html>
<head>
    <title>Login // Snapbase</title>
    <meta charset="utf-8">
    <link rel="stylesheet" type="text/css" href="css/login_style.css">
<link rel="preconnect" href="https://fonts.google.com/"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.google.com/specimen/Roboto" rel="stylesheet"/>
    <meta name="viewport" content="width=device-width, inicial-scale = 1.0">


</head>

<body>


    <header class="menu">
		<h1> 
            <a href="index.html"><img src="img/artboard_3.png"></a>
        </h1>
		
		<div class="menutext">
			<a href="user_page.html">My Profile</a>
            <a href="tutorial_page.html">Resources</a>
            <a href="#">Prices</a>
            <a href="#">About Us</a>
		</div>
		
		<div class="menulogin">
			<a href="login.html">Log in</a>
            <a href="login.html">Sign Up</a>
        </div>

        <div class="menu-mobile">
            <a href="#"><img src="img/menu_symbol.webp"></a>
        </div>

    </header>

    <div class="title">
        <h2>Welcome to Snapbase!</h2>
    </div>

    <div class="subtitle">
        <p>Don't have an account?<span> Sign in</span>!</p>
    </div>

    <div class="info">
        <p>Add in your login information</p>
    </div>
   
        <form class="sub" method="POST">
            <div>
                <input type="text" name="name" placeholder="username" class="input-elements" required>
            </div>
            
            <div>
                <input type="email" name="email" placeholder="email" class="input-elements" required>
            </div>

            <div>
                <input type="password" name="password" placeholder="password" class="input-elements" required>
            </div>
        </form>
    </div>

    <div class="password-remember">
        <a href="#">Forgot your password?</a>
    </div>
    
    <div class="button-container">
        <div class="login">
            <form method="get" action="index.html">
                <button class="login-button" type="submit">LOG IN</button>
            </form>
        </div>

    <div class ="line"></div>
    
        <button class="fb-login">
            <img src="img/fb_logo.png"/>
            <p>LOG IN WITH FACEBOOK</p>
        </button>

        <button class ="google-login">
            <img src="img/google_logo.png"/>
            <p>LOG IN WITH GOOGLE</p>
        </button>
    </div>

    <div class="links">
        <a href="#"> Terms of Use</a>
        <a href="#"> Privacy Policy</a>
    </div>

    <div class="notices">
        <div class="recaptcha">
            <p>* This website is protected by reCAPTCHA Enterprise.</p>
        </div>
       
        <div class="google-apply">
            <p>Google's Privacy Policy and Terms of Service apply.</p>
        </div>

    </div>
   
</body>
</html>
